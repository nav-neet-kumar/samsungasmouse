<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="A simple directory of Navneet Kumar's websites, projects, and useful tools.">
<title>Navneet | Link Hub</title>
<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#111a2b;--line:#25324a;--text:#f2f5ff;--muted:#9aa8c0;--accent:#79e5f2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#20375b 0,transparent 48%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1000px;margin:auto;padding:64px 22px 30px}.head{text-align:center;margin-bottom:32px}.avatar{width:58px;height:58px;margin:0 auto 15px;border-radius:19px;display:grid;place-items:center;background:linear-gradient(135deg,#79e5f2,#a5b4fc);color:#08111f;font-weight:900;font-size:21px;box-shadow:0 12px 38px #79e5f225}.eyebrow{color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.head h1{font-size:clamp(29px,5vw,43px);letter-spacing:-.045em;margin:8px 0}.head p{color:var(--muted);margin:0}.search{max-width:540px;margin:24px auto 0}.search input{width:100%;background:#0e1626;border:1px solid var(--line);border-radius:13px;padding:13px 16px;color:var(--text);font:inherit;outline:none}.search input:focus{border-color:var(--accent)}.filters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:22px 0 26px}.filter{cursor:pointer;border:1px solid var(--line);background:#0e1626;color:var(--muted);border-radius:99px;padding:7px 13px;font:inherit;font-size:12px}.filter.active,.filter:hover{border-color:#467b8b;background:#14303b;color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{display:flex;align-items:center;gap:13px;min-width:0;padding:16px;border:1px solid var(--line);background:linear-gradient(145deg,#141f33,#0e1524);border-radius:16px;transition:transform .18s,border-color .18s}.card:hover{transform:translateY(-3px);border-color:#4b7892}.icon{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:#1b2b43;border:1px solid #ffffff0c;font-size:20px}.info{min-width:0;flex:1}.info strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arrow{color:#7186a7;font-size:18px}.empty{grid-column:1/-1;text-align:center;padding:35px;border:1px dashed var(--line);border-radius:15px;color:var(--muted)}footer{text-align:center;color:#71809a;font-size:11px;margin-top:35px}@media(max-width:720px){.wrap{padding-top:40px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:460px){.wrap{padding:32px 15px 24px}.grid{grid-template-columns:1fr}.card{padding:13px}}
</style>
</head>
<body>
<main class="wrap">
<header class="head">
<div class="avatar" aria-hidden="true">NK</div>
<div class="eyebrow">Personal link hub</div>
<h1>Navneet Kumar</h1>
<p>My websites, projects & useful links — all in one place.</p>
<div class="search"><input id="search" type="search" aria-label="Search links" placeholder="Search websites and tools…"></div>
</header>
<nav class="filters" id="filters" aria-label="Link categories"></nav>
<section class="grid" id="links" aria-live="polite"></section>
<footer>© <span id="year"></span> Navneet Kumar</footer>
</main>
<script>
const links=[
{name:"Portfolio",url:"https://navneet.webline.cloud",category:"My Websites",icon:"✦",detail:"Personal portfolio"},
{name:"Webline Cloud",url:"https://webline.cloud",category:"My Websites",icon:"☁",detail:"Web projects & services"},
{name:"IsItFree?",url:"https://isitfree.webline.cloud",category:"My Websites",icon:"◈",detail:"Software license directory"},
{name:"Home Loan Prepayment",url:"https://home-loan-prepayment.webline.cloud",category:"My Websites",icon:"⌂",detail:"Loan planning calculator"},
{name:"Piano",url:"https://piano.webline.cloud",category:"My Websites",icon:"♫",detail:"Online piano project"},
{name:"RO Water Solution",url:"https://rowatersolution.in",category:"My Websites",icon:"💧",detail:"RO water services"},
{name:"GitHub Profile",url:"https://github.com/nav-neet-kumar",category:"Projects",icon:"⌘",detail:"Repositories & code"},
{name:"Samsung as Mouse",url:"https://github.com/nav-neet-kumar/samsungasmouse",category:"Projects",icon:"▣",detail:"Personal link hub source"},
{name:"SoftwareLicense.fyi",url:"https://github.com/navneet-20/SoftwareLicense.fyi",category:"Projects",icon:"◉",detail:"Software discovery project"},
{name:"LinkedIn",url:"https://www.linkedin.com/in/navneet-pro",category:"Social",icon:"in",detail:"Professional profile"},
{name:"Instagram",url:"https://www.instagram.com/",category:"Social",icon:"◎",detail:"Instagram"},
{name:"YouTube Studio",url:"https://studio.youtube.com",category:"Social",icon:"▶",detail:"Video publishing"},
{name:"Amazon KDP",url:"https://kdp.amazon.com",category:"Publishing",icon:"📚",detail:"Manage my published book"},
{name:"Cloudflare",url:"https://dash.cloudflare.com",category:"Tools",icon:"🌐",detail:"DNS, tunnels & hosting"},
{name:"Microsoft Learn",url:"https://learn.microsoft.com",category:"Tools",icon:"▤",detail:"Cloud & endpoint learning"},
{name:"Docker Hub",url:"https://hub.docker.com",category:"Tools",icon:"◫",detail:"Container registry"},
{name:"Terraform Docs",url:"https://developer.hashicorp.com/terraform",category:"Tools",icon:"⌘",detail:"Infrastructure as code"},
{name:"Ansible Docs",url:"https://docs.ansible.com",category:"Tools",icon:"⚙",detail:"Automation documentation"}
];
let category="All";
const filters=document.getElementById("filters"),host=document.getElementById("links"),search=document.getElementById("search");
function renderFilters(){const categories=["All",...new Set(links.map(x=>x.category))];filters.innerHTML=categories.map(c=>'<button class="filter '+(c===category?'active':'')+'" data-cat="'+c+'">'+c+'</button>').join("");filters.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{category=b.dataset.cat;renderFilters();renderLinks()}))}
function renderLinks(){const q=search.value.trim().toLowerCase();const list=links.filter(x=>(category==="All"||x.category===category)&&(x.name+" "+x.detail+" "+x.category).toLowerCase().includes(q));host.innerHTML=list.length?list.map(x=>'<a class="card" href="'+x.url+'" target="_blank" rel="noopener noreferrer"><span class="icon">'+x.icon+'</span><span class="info"><strong>'+x.name+'</strong><small>'+x.detail+'</small></span><span class="arrow" aria-hidden="true">↗</span></a>').join(""):'<div class="empty">No links found. Try another search.</div>'}
search.addEventListener("input",renderLinks);document.getElementById("year").textContent=new Date().getFullYear();renderFilters();renderLinks();
</script>
</body>
</html>
