<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d18">
<meta name="description" content="Navneet Kumar's links and websites.">
<title>Navneet Kumar | Links</title>
<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#111a2b;--line:#25324a;--text:#f2f5ff;--muted:#9aa8c0;--accent:#79e5f2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#20375b 0,transparent 48%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:820px;margin:auto;padding:64px 22px 30px}.head{text-align:center;margin-bottom:30px}.avatar{width:58px;height:58px;margin:0 auto 15px;border-radius:19px;display:grid;place-items:center;background:linear-gradient(135deg,#79e5f2,#a5b4fc);color:#08111f;font-weight:900;font-size:21px}.head h1{font-size:clamp(29px,5vw,40px);letter-spacing:-.04em;margin:8px 0}.head p{color:var(--muted);margin:0}.search{max-width:520px;margin:22px auto 0}.search input{width:100%;background:#0e1626;border:1px solid var(--line);border-radius:13px;padding:13px 16px;color:var(--text);font:inherit;outline:none}.search input:focus{border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{display:flex;align-items:center;gap:13px;min-width:0;padding:16px;border:1px solid var(--line);background:linear-gradient(145deg,#141f33,#0e1524);border-radius:15px;transition:transform .18s,border-color .18s}.card:hover{transform:translateY(-3px);border-color:#4b7892}.icon{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:#1b2b43;border:1px solid #ffffff0c;font-size:20px}.info{min-width:0;flex:1}.info strong{display:block;font-size:14px}.info small{display:block;color:var(--muted);font-size:11px;overflow-wrap:anywhere}.arrow{color:#7186a7;font-size:18px}.empty{grid-column:1/-1;text-align:center;padding:30px;color:var(--muted)}footer{text-align:center;color:#71809a;font-size:11px;margin-top:30px}@media(max-width:540px){.wrap{padding:36px 15px 24px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<header class="head">
<div class="avatar" aria-hidden="true">NK</div>
<h1>Navneet Kumar</h1>
<p>My links, websites and projects.</p>
<div class="search"><input id="search" type="search" aria-label="Search links" placeholder="Search links…"></div>
</header>
<section class="grid" id="links" aria-live="polite"></section>
<footer>© <span id="year"></span> Navneet Kumar</footer>
</main>
<script>
const links=[
{name:"GitHub",url:"https://github.com/nav-neet-kumar",detail:"My GitHub profile",icon:"⌘"},
{name:"My Website",url:"https://navneet.webline.cloud",detail:"navneet.webline.cloud",icon:"✦"},
{name:"Office Tools",url:"https://tools.webline.cloud",detail:"My office tools project",icon:"▦"},
{name:"Old Portfolio",url:"https://navneet.pro",detail:"navneet.pro",icon:"◈"},
{name:"IsItFree?",url:"https://isitfree.webline.cloud",detail:"Software license directory",icon:"✓"},
{name:"Download Proxy",url:"https://download.webline.cloud/",detail:"Download proxy website",icon:"↓"},
{name:"GitHub Runner Chatbot",url:"https://nav-neet-kumar.github.io/chatbotusinggithubrunner/",detail:"Public GitHub Pages project",icon:"✧"},
{name:"Windows Insights",url:"https://windowsupdate.webline.cloud",detail:"Windows update insights",icon:"▣"}
];
const host=document.getElementById("links"),search=document.getElementById("search");
function render(){const q=search.value.trim().toLowerCase();const list=links.filter(x=>(x.name+" "+x.detail+" "+x.url).toLowerCase().includes(q));host.innerHTML=list.length?list.map(x=>'<a class="card" href="'+x.url+'" target="_blank" rel="noopener noreferrer"><span class="icon">'+x.icon+'</span><span class="info"><strong>'+x.name+'</strong><small>'+x.detail+'</small></span><span class="arrow" aria-hidden="true">↗</span></a>').join(""):'<div class="empty">No links found.</div>'}
search.addEventListener("input",render);document.getElementById("year").textContent=new Date().getFullYear();render();
</script>
</body>
</html>
